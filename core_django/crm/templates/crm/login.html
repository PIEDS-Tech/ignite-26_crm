{% load static %}<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Sign in — Ignite CRM</title>
  <link rel="stylesheet" href="{% static 'basecoat/basecoat.css' %}">
  <link rel="stylesheet" href="{% static 'basecoat/app.css' %}">
  <script>
    if (localStorage.theme === 'dark' ||
        (!('theme' in localStorage) && matchMedia('(prefers-color-scheme: dark)').matches)) {
      document.documentElement.classList.add('dark');
    }
  </script>
</head>
<body>
<div style="display:grid;place-items:center;min-height:100vh;padding:1.5rem">
  <div class="card" style="width:100%;max-width:22rem">
    <header>
      <h2>Ignite CRM</h2>
      <p class="muted text-sm">PIEDS outreach — sign in to continue.</p>
    </header>
    <section>
      <form method="post" class="col">
        {% csrf_token %}
        {% if form.errors %}
          <div class="alert alert-destructive"><section><p>Incorrect username or password.</p></section></div>
        {% endif %}
        <div class="col" style="gap:.35rem">
          <label class="label" for="id_username">Username</label>
          <input class="input" type="text" name="username" id="id_username" autofocus required>
        </div>
        <div class="col" style="gap:.35rem">
          <label class="label" for="id_password">Password</label>
          <input class="input" type="password" name="password" id="id_password" required>
        </div>
        <button type="submit" class="btn">Sign in</button>
      </form>
    </section>
  </div>
</div>
</body>
</html>
